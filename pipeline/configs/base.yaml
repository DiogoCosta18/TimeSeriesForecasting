random_seed: 20260521
metric_to_optimize: REL_NAIVE_mean_clipped
naive_denominator: SeasonalNaive

features:
  - feature_non_normality
  - feature_nonlinearity
  - feature_spectral_entropy
  - feature_evolving_seasonality
  - feature_structural_break_strength
  - feature_arch_stat

decomposition_methods:
  - without_stl
  - stl_seasonal_naive
  - stl_model_all_components

model_families:
  statistical: true
  mlforecast: true
  neuralforecast: true
  transformers: true

finetuning:
  no_finetune: true
  finetune_by_feature_bucket: true
  finetune_by_individual_series: true
  finetune_by_bucket: true

representative_sampling:
  n_per_source_dataset: 750
  n_strata: 30
  method: stratified_quantile
  replacement: false

feature_compute:
  n_jobs: auto
  checkpoint_every_series: 100
  progress_log_every_series: 25
  timeout_seconds_per_series:
    smoke: 30
    pilot: 60
    full: 120
    large: 120
  max_candidate_series_per_source:
    smoke: 50
    pilot: 300
    full: 3000
    large: null

mlforecast_auto:
  num_samples: 50
  input_size: null
  refit: 1

neuralforecast_auto:
  backend: optuna
  num_samples: 50
  max_steps: 500
  finetune_max_steps: 50

transformer_auto:
  backend: optuna
  num_samples: 50
  max_steps: 500
  finetune_max_steps: 50
