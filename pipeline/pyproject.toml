[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forecasting-pipeline"
version = "0.1.0"
description = "Leakage-safe M3/M4 feature-regime forecasting experiments for Vast.ai GPUs"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# fugue's pytest plugins (installed with statsforecast) import numpy at start-up, before
# conftest.py can apply the numeric pins of src/__init__.py; the tests do not use them.
addopts = "-q -m 'not integration' -p no:fugue_test -p no:fugue_test_fixtures"
markers = ["integration: I1 and I4, real fits end to end (minutes); run with -m integration"]
